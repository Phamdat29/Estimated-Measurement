<style>

.pad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;min-height:0}

input[type=range]{flex:1;accent-color:#fff;height:36px}
.cmp .b{font-size:14px;padding:.55em 1.05em}.row.cmp{align-items:center}
.bs{position:absolute;left:10px;top:54px;font-size:12px;z-index:5}

{const hold=new Map(),rel=e=>{const h=hold.get(e.pointerId);if(!h)return;hold.delete(e.pointerId);setTimeout(()=>h.b.classList.remove('pr'),Math.max(0,90-(performance.now()-h.t)))};

 gen(){const[n,d]=[[1,2],[1,3],[2,3],[2,5],[3,5]][RI(0,4)],len=R(360,760),x1=R(60,940-len),dir=RI(0,1),sx=dir?x1+len:x1,sg=dir?-1:1;
  return{n,d,len,x1,sx,sg,y:320,tx:sx+sg*len*n/d,q:`Kéo điểm tới ${n}/${d} thanh, tính từ bên ${dir?'phải':'trái'}`,h:'đầu chấm đặc là mốc 0, đầu rỗng là mốc 1'}},
 ui(p,P,sub){const st=stage(p),b=bar(p),ok=E('button','b r','XÁC NHẬN');b.style.justifyContent='center';b.append(ok);st.style.touchAction='none';
  const ex=P.sx+P.sg*P.len,lb=(x,t)=>`<text x="${x}" y="${P.y-28}" fill="#bbb" font-size="28" font-weight="800" text-anchor="middle" font-family="inherit">${t}</text>`;

   const add=(x,col,txt,dy,ms,ring)=>T(ms,()=>{const a=x<110?'start':x>890?'end':'middle';
    svg.insertAdjacentHTML('beforeend',`<g style="opacity:0;transition:opacity .45s"><circle cx="${x}" cy="${P.y}" r="15" fill="${ring?'none':col}" stroke="${ring?col:'#1a1a1a'}" stroke-width="${ring?5:3}"/><text x="${x}" y="${P.y+dy}" fill="${col}" font-size="30" font-weight="800" text-anchor="${a}" stroke="#1a1a1a" stroke-width="5" paint-order="stroke" font-family="inherit">${txt}</text></g>`);
    const g=svg.lastElementChild;void g.getBoundingClientRect();g.style.opacity=1;if(snd(p))sfx.mark()});
   add(P.tx,'#fff','ĐÁP ÁN',-62,0,1);add(ans[me],'#5ec8ff','BẠN',64,700);add(ans[1-me],'#ffb04a',OPP(),104,1400);return 1400+450+1400}},
 err:(v,P)=>Math.abs(v-P.tx)/P.len*100,

let G={lv:5,t:180,sc:[0,0],w:{},seen:new Set(),end:0,on:false};
const resetW=()=>{MODES.forEach(m=>G.w[m.id]=1);G.seen.clear()};
function clearRd(){P2.forEach(p=>{clearTimeout(p.tbT);p.tbEnd=0;p.tb.style.transition='none';p.tb.style.opacity=0});if(rd){rd.dead=true;rd.tm.forEach(clearTimeout);rd.iv.forEach(clearInterval)}rd=null}
function addScore(i,pts){const from=G.sc[i],to=from+pts,t0=performance.now(),s=(solo&&i==0)?BS:P2[i].sc;
 (function f(n){const k=Math.min(1,(n-t0)/1100);s.show(Math.round(from+pts*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)})(t0);G.sc[i]=to}
function menu(){G.on=false;clearRd();P2.forEach(p=>{p.hd.classList.add('off');p.setQ('');p.bd.innerHTML='';const c=E('div','ctr');c.style.gap='8px';
 c.append(E('div','ttl','ĐO LƯỜNG'),E('div','sub','Estimated Measurement'));
 const md=E('div','row cmp');[[0,'2 người'],[1,'Đấu Máy']].forEach(([v,t])=>{const x=E('button','b'+(solo==!!v?' r':''),t);tapOn(x,()=>{solo=!!v;BS.el.style.display=solo?'flex':'none';layout();menu()});md.append(x)});c.append(md);
 if(solo){const dr=E('div','row cmp'),mn=E('button','b','−'),pl=E('button','b','+'),lb=E('div','res',G.lv+' · '+LV[G.lv-1]),pp=E('div','pips',Array.from({length:10},(_,k)=>`<i${k<G.lv?' class="on"':''}></i>`).join(''));
  lb.style.fontSize='18px';lb.style.minWidth='140px';tapOn(mn,()=>{G.lv=Math.max(1,G.lv-1);menu()});tapOn(pl,()=>{G.lv=Math.min(10,G.lv+1);menu()});dr.append(mn,lb,pl);c.append(E('div','lb','ĐỘ KHÓ MÁY'),dr,pp)}
 const row=E('div','row cmp');[1,3,5,10].forEach(m=>{const x=E('button','b'+(G.t==m*60?' r':''),m+' phút');tapOn(x,()=>{G.t=m*60;menu()});row.append(x)});
 const s=E('button','b r big','BẮT ĐẦU');s.style.cssText='font-size:18px;padding:.65em 2.2em';tapOn(s,start);c.append(row,s);p.bd.append(c)})}
function start(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();sfx.start();G.sc=[0,0];resetW();G.end=Date.now()+G.t*1000;G.on=true;P2.forEach(p=>{p.hd.classList.remove('off');p.sc.show(0)});BS.show(0);nextRound()}
function pick(){const ws=MODES.map(m=>G.w[m.id]);let r=Math.random()*ws.reduce((a,b)=>a+b),i=0;for(;i<ws.length-1&&(r-=ws[i])>0;i++);
 const m=MODES[i];G.w[m.id]*=.12;G.seen.add(m.id);if(G.seen.size==MODES.length)resetW();return m}
function reel(p,idx){const N=MODES.length;
 p.bd.innerHTML=`<div class="ctr"><div class="rl">PHẦN DỰ THI</div><div class="wheel">${'<div class="wi"></div>'.repeat(7)}</div><div class="pips">${MODES.map(()=>'<i></i>').join('')}</div><div class="en"></div></div>`;
 const wh=p.bd.querySelector('.wheel'),its=[...wh.querySelectorAll('.wi')],pp=[...p.bd.querySelectorAll('.pips i')],en=p.bd.querySelector('.en'),
  s0=rd.rs==null?(rd.rs=RI(0,N-1)):rd.rs,tot=N*3+(((idx-s0)%N)+N)%N,D=4200,t0=performance.now();let last=null;
 const md=x=>((x%N)+N)%N;
 const draw=pos=>{const rh=wh.clientHeight/5,c=Math.round(pos);
  its.forEach((el,k)=>{const j=k-3,d=c+j-pos,i=md(c+j);if(el._i!==i){el._i=i;el.textContent=MODES[i].n}
   el.style.transform=`translateY(${d*rh*.9}px) rotateX(${-d*30}deg) scale(${1-Math.min(1,Math.abs(d))*.14})`;el.style.opacity=Math.max(0,1-Math.abs(d)*.38)});
  if(c!==last){last=c;pp.forEach((x,k)=>x.classList.toggle('on',k==md(c)));if(snd(p))beep(520,.02,.05)}};
 raf(now=>{const k=Math.max(0,Math.min(1,(now-t0)/D)),e=1-Math.pow(1-k,4);draw(s0+e*tot);
  if(k>=1){wh.classList.add('done');its[3].classList.add('win');en.textContent=MODES[idx].en.toUpperCase();en.classList.add('pop');if(snd(p))beep(900,.12,.15);return false}})}
const LV=['Siêu dễ','Rất dễ','Dễ','Hơi dễ','Vừa','Hơi khó','Khó','Rất khó','Cao thủ','Bậc thầy'];
const ps=()=>solo?[P2[1]]:P2,NZ=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());
const MUL=[3.2,2.5,2,1.6,1.3,1.05,.85,.68,.52,.4];
function botPlay(m,P){const k=MUL[G.lv-1],z=s=>NZ()*s*k,th=()=>R(2500,6500)*(1.7-G.lv*.1),go=(ms,v)=>T(Math.max(0,ms),()=>submit(0,v)),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
 switch(m.id){
 case'angle':go(th(),Math.round(cl(P.t+z(12),1,359)*10)/10);break;
 case'dots':go(6200+th(),Math.max(0,Math.round(P.n+z(Math.max(1.5,P.n*.15)))));break;
 case'throw':go(900+P.tv/.6*1000+th()*.5,Math.round(cl(P.xl+z(80),0,1000)));break;
 case'beat':{const iv=P.I*(1+z(.025)),bs=Math.abs(z(60));go(P.t0+11*P.I+200-performance.now(),Array.from({length:8},(_,j)=>P.t0+4*P.I+j*iv+bs+z(50)));break}
 case'btn':{const n=Math.max(0,Math.round(P.r+z(1.8)));Array.from({length:n},()=>R(3100,7900)).forEach(t=>T(t,()=>P.flash&&P.flash()));go(8000,n);break}
 case'pump':go(2000+th(),Math.round(cl(P.Tg+z(.1*P.V),0,P.V)*10)/10);break;
 case'stop':{const v=Math.max(.3,P.tg+z(.065*P.tg));go(900+v*1000,v);break}
 case'catch':{const v=Math.max(.3,P.th+z(.06*P.th));go(900+v*1000,v);break}
 case'mid':go(1000+th()*.7,Math.round(cl(P.tx+z(.06*P.len),P.x1,P.x1+P.len)))}}
function nextRound(){clearRd();const m=pick(),idx=MODES.indexOf(m);rd={m,ans:[null,null],rdy:solo?[1,0]:[0,0],btns:[],tm:[],iv:[],dead:false};
 P2.forEach(p=>p.rv=null);ps().forEach(p=>{p.setQ('');reel(p,idx)});
 T(5700,()=>{sfx.round();rd.P=m.gen();ps().forEach(p=>{p.setQ(rd.P.q,rd.P.h);p.bd.innerHTML='';m.ui(p,rd.P,v=>submit(p.i,v))});if(solo)botPlay(m,rd.P)})}
function submit(i,v){if(!rd||rd.ans[i]!=null)return;rd.ans[i]=v;sfx.lock(i);P2[i].stopBar();if(rd.ans[1-i]==null)rush(P2[1-i]);P2[i].bd.append(E('div','wait','ĐANG CHỜ…'));if(rd.ans[0]!=null&&rd.ans[1]!=null)T(700,reveal)}
function reveal(){sfx.reveal();document.querySelectorAll('.wait').forEach(x=>x.remove());let d=0;P2.forEach(p=>{if(p.rv)d=Math.max(d,p.rv(rd.ans,rd.P)||0)});T(d,summary)}
function summary(){const{m,P,ans}=rd,e=ans.map(v=>m.err(v,P)),w=e[0]===e[1]?-1:e[0]<e[1]?0:1;if(w>=0)addScore(w,100);(solo?(w==1?sfx.win:w==0?sfx.lose:sfx.draw):(w<0?sfx.draw:sfx.win))();
 ps().forEach(p=>{const me=p.i,ot=1-me,o=E('div','ov');
  o.innerHTML=`<div class="res ${w==me?'w':''}">${w<0?'HÒA':w==me?'THẮNG +100':'THUA'}</div><div class="sub">Đáp án · ${m.ans(P)}</div><div class="rw"><div>Bạn<b>${m.fmt(ans[me],P)}</b>lệch ${m.fe(e[me])}</div><div>${solo?'Máy':'Đối thủ'}<b>${m.fmt(ans[ot],P)}</b>lệch ${m.fe(e[ot])}</div></div>`;
  const bt=E('button','b r',solo?'TIẾP TỤC':'SẴN SÀNG (0/2)');bt.style.marginTop='6px';rd.btns.push(bt);
  tapOn(bt,()=>{if(rd.rdy[me])return;rd.rdy[me]=1;const n=rd.rdy[0]+rd.rdy[1];bt.classList.remove('r');bt.disabled=true;bt.style.opacity=1;
   rd.btns.forEach(x=>x.textContent=`SẴN SÀNG (${n}/2)`);if(n==2)T(350,nextRound)});
  o.append(bt);p.bd.append(o)})}
function finish(){G.on=false;clearRd();const s=G.sc;(solo?(s[1]>s[0]?sfx.win:s[1]<s[0]?sfx.lose:sfx.draw):(s[0]==s[1]?sfx.draw:sfx.win))(1);P2.forEach(p=>{p.hd.classList.add('off');p.setQ('');p.bd.innerHTML='';const me=s[p.i],ot=s[1-p.i],c=E('div','ctr');
 c.innerHTML=`<div class="lb">KẾT THÚC</div><div class="res ${me>ot?'w':''}">${me>ot?'THẮNG':me<ot?'THUA':'HÒA'}</div><div class="big0">${me} : ${ot}</div>`;
 const bt=E('button','b r big','CHƠI LẠI');tapOn(bt,menu);c.append(bt);p.bd.append(c)})}
setInterval(()=>{if(!G.on)return;const l=Math.max(0,Math.ceil((G.end-Date.now())/1000));if(l<=10&&l>0&&l!=sfx.lastL)sfx.warn();sfx.lastL=l;
 P2.forEach(p=>{p.tm.textContent=`${Math.floor(l/60)}:${String(l%60).padStart(2,'0')}`;p.tm.classList.toggle('lo',l<=10)});if(!l)finish()},250);
resetW();menu();
